name: Publish @jchpro/ngx-admin to NPM
on:
  push:
    tags:
      - 'admin-*'

jobs:
  publish:
    name: Build and publish @jchpro/ngx-admin
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.3'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build common library
        run: npm run build:common:prod
      - name: Build admin library
        run: npm run build:admin:prod
      - name: Publish admin library
        working-directory: ./dist/@jchpro/ngx-admin
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
