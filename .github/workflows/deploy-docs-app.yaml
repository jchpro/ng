name: Deploy docs-app

# Deploys docs-app to the VPS through the infra-vps deploy gate (restricted SSH, atomic release, automatic rollback).
# Adapted from jchpro/infra-vps/.github/workflows/deploy-ui.yml: that repo is private and this one is public, so
# the workflow cannot call it and the steps live here (with a local copy of the ssh-deploy action).
# Runs on every push to `main` except docs-only changes, and by hand (a dry run by default: builds and packs,
# validates the Environment, does not connect to the server). The Environment `docs-prod` holds DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS and DEPLOY_HOST (all secrets: the logs of a public repo are public and only secrets are masked); it is limited to the `main` branch.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack only, do not connect to the server
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# Never cancel a deploy midway; queue the next one instead
concurrency:
  group: deploy-docs-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment: docs-prod
    timeout-minutes: 20
    env:
      DIST_DIR: dist/docs-app/browser
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The docs-app resolves @jchpro/* libraries from dist/, so the build covers them first
      - name: Build libraries and docs-app
        run: npm run build
      - name: Package
        run: |
          test -f "$DIST_DIR/index.html" || { echo "::error::$DIST_DIR/index.html not found"; exit 1; }
          tar -czf release.tgz -C "$DIST_DIR" .
      - name: Deploy
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          command: release ${{ github.sha }}
          artifact: release.tgz
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
