<!-- Import KitChipInput. Enter or a comma adds, a pasted list is split, Backspace removes the last -->
<div class="kit-field">
  <label class="kit-field__label" for="tasks">Tasks</label>
  <kit-chip-input inputId="tasks" ariaLabel="Tasks" placeholder="Add a task" [formField]="form.tasks" />
  <!-- Duplicates and limits are validators of the field, the error is shown under the chips -->
  <kit-field-error [field]="form.tasks" />
</div>

<!-- Without Signal Forms -->
<kit-chip-input ariaLabel="Tags" addOnBlur [(value)]="tags" />

<!-- Chips that only show values: the classes alone -->
<ul class="kit-chips"><li class="kit-chip">Draft</li></ul>
