<!-- Checkbox -->
<label class="kit-check">
  <input class="kit-check__input" type="checkbox"> Send me updates
</label>

<!-- Radio group, side by side -->
<div class="kit-check-group kit-check-group--inline">
  <label class="kit-check"><input class="kit-check__input" type="radio" name="plan" value="free"> Free</label>
  <label class="kit-check"><input class="kit-check__input" type="radio" name="plan" value="pro"> Pro</label>
</div>

<!-- Switch: a checkbox with role="switch" -->
<label class="kit-check">
  <input class="kit-check__input" type="checkbox" role="switch"> Notifications
</label>

<!-- Without a wrapping label, give it a name -->
<input class="kit-check__input" type="checkbox" aria-label="Select row">
