<!-- import KitDataTable, KitSearchInput, KitFilter, KitFilterChips, KitSort and KitPaginator into the component -->
<kit-data-table
  [state]="state"
  [resource]="users"
  [total]="page()?.total"
  [empty]="!page()?.items?.length">

  <div kitTableSearch class="kit-data-table__search">
    <svg lucideSearch></svg>
    <input kitSearch class="kit-field__control" type="search" aria-label="Search users">
  </div>

  <div kitTableFilters class="kit-data-table__filters">
    <select kitFilter="role" class="kit-field__control" aria-label="Role">
      <option value="">All roles</option>
      <option value="Admin">Admin</option>
      <option value="Editor">Editor</option>
    </select>
  </div>

  <button kitTableActions type="button" class="kit-btn kit-btn--primary">Add user</button>

  <!-- one chip per applied filter, and "Clear all"; nothing while no filter is applied -->
  <kit-filter-chips kitTableChips [labels]="{ role: 'Role' }" />

  <table class="kit-table">
    <thead>
      <tr>
        <th kitSort="name">User</th>
        <th>Status</th>
        <th kitSort="seats" class="kit-cell--num">Seats</th>
        <th class="kit-cell--actions"><span class="kit-table__sr-only">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <!-- `user` is typed: the row type of `items` -->
      @for (user of page()?.items; track user.id) {
        <tr>
          <td>
            <a class="kit-table__link" [routerLink]="['/users', user.id]">{{ user.name }}</a>
            <span class="kit-table__secondary">{{ user.email }}</span>
          </td>
          <td><span class="kit-badge kit-badge--success">{{ user.status }}</span></td>
          <td class="kit-cell--num">{{ user.seats | number }}</td>
          <td class="kit-cell--actions">
            <button type="button" class="kit-btn kit-btn--ghost kit-btn--icon"
                    [attr.aria-label]="'Actions for ' + user.name" [kitMenuTriggerFor]="rowMenu">
              <svg lucideEllipsisVertical></svg>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <kit-paginator />
</kit-data-table>
