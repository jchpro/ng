<!-- Put kit-prose on a container: its plain elements are styled, nothing else is touched -->
<article class="kit-prose">
  <h2>Release notes</h2>
  <p>Plain elements, <a href="/changelog">links</a> and <code>code</code> need no classes.</p>
  <blockquote>A quote, set apart.</blockquote>

  <!-- Wrap a table for the rounded frame and horizontal scroll on narrow screens -->
  <div class="kit-table-frame">
    <table>
      <tr><th>Name</th><th>What it does</th></tr>
      <tr><td><code>kit-btn</code></td><td>A button</td></tr>
    </table>
  </div>
</article>

<!-- Elements with a class are left alone: a kit-btn link or a card inside keeps its own look -->
