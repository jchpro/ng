@if (lib(); as activeLib) {
  <kit-shell-nav-section [title]="activeLib.name">
    @for (page of pages(); track page.path) {
      <kit-shell-nav-item [link]="['/docs', 'lib', activeLib.path, page.path]" [icon]="page.icon">
        {{ page.menuName }}
      </kit-shell-nav-item>
    }
    <kit-shell-nav-item [icon]="moreIcon" [disabled]="true">More to come...</kit-shell-nav-item>
  </kit-shell-nav-section>
}
