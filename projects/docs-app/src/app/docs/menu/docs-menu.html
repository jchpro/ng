@if (lib()) {
  <h3>{{ lib()!.name }}</h3>
  <nav class="flex col">
    @for (page of pages(); track $index) {
      <a class="clear"
         [routerLink]="['/docs', 'lib', lib()!.path, page.path]"
         routerLinkActive="active">
        <fa-icon [icon]="page.icon"></fa-icon>
        <span>
          {{ page.menuName }}
        </span>
      </a>
    }
    <a class="clear disabled">
      <fa-icon [icon]="faClock"></fa-icon>
      <span>
        More to come...
      </span>
    </a>
  </nav>
}
