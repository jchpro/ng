<header class="toolbar flex row x-center gap-sm">

  @if (sidebarState() === 'toggle') {
    <button type="button"
            class="icon-btn"
            (click)="toggleSidebar()">
      <fa-icon [icon]="faBars"></fa-icon>
    </button>
  }

  <a class="clear brand"
     [routerLink]="['/docs']">
    <span>&commat;jchpro/ngx</span>
  </a>

  @if (!mobileLayout()) {
    <nav class="top-nav flex row x-center gap-sm">
      @for (lib of libs; track $index) {
        <a class="clear"
           [routerLink]="['/docs', 'lib', lib.path]"
           [routerLinkActive]="'active'">
          <span>{{ lib.name }}</span>
        </a>
      }
    </nav>
  }

  <span class="flex-grow"></span>

  <app-docs-theme-selector></app-docs-theme-selector>
</header>

@if (mobileLayout()) {
  <nav class="top-nav mobile flex row m-center gap-sm">
    @for (lib of libs; track $index) {
      <a class="clear"
         [routerLink]="['/docs', 'lib', lib.path]"
         [routerLinkActive]="'active'">
        <span>{{ lib.name }}</span>
      </a>
    }
  </nav>
}

<div class="layout flex row">
  @if (sidebarState() !== 'hidden') {
    <nav class="sidebar"
         [class.toggle]="sidebarState() === 'toggle'"
         [class.opened]="sidebarOpened()"
         (click)="closeSidebar()">
      <app-docs-menu></app-docs-menu>
    </nav>
  }

  <main class="content flex-grow">
    <router-outlet></router-outlet>
  </main>
</div>
