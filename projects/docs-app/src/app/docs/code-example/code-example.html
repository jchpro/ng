<!-- Utils panel -->
@if (!fetching() && isValid()) {
  <div class="panel flex row x-center">
    @if (copied()) {
      <span class="copied">Copied!</span>
    }
    <a class="icon-btn"
       [href]="source()"
       [download]="sourceFilename()"
       title="Download file">
      <svg lucideDownload></svg>
    </a>
    <button type="button"
            class="icon-btn"
            title="Copy to clipboard"
            [cdkCopyToClipboard]="code()"
            (cdkCopyToClipboardCopied)="onCopied()">
      <svg lucideCopy></svg>
    </button>
    <span class="lang">{{ prettyLang() }}</span>
  </div>
}

<!-- Loading indicator or highlight.js -->
@if (fetching()) {
  <div class="fetching">
    <svg lucideLoaderCircle class="spin" size="3em"></svg>
  </div>
} @else {
  <pre class="hljs" [innerHTML]="html()"></pre>
}
