<button type="button" class="kit-btn kit-btn--ghost kit-btn--icon"
        aria-label="Change theme" title="Change theme"
        [kitMenuTriggerFor]="themeMenu">
  <svg [lucideIcon]="themeIcon"></svg>
</button>

<ng-template #themeMenu>
  <div kitMenu>
    <div class="kit-menu__label">Color</div>
    @for (option of colorOptions; track option.color) {
      <button type="button" kitMenuItem [checked]="color() === option.color" (click)="changeColor(option.color)">
        <svg [lucideIcon]="color() === option.color ? selectedIcon : unselectedIcon"></svg>
        <span>{{ option.label }}</span>
      </button>
    }

    <hr class="kit-menu__separator">

    <div class="kit-menu__label">Scheme</div>
    @for (option of schemeOptions; track option.scheme) {
      <button type="button" kitMenuItem [checked]="scheme() === option.scheme" (click)="changeScheme(option.scheme)">
        <svg [lucideIcon]="scheme() === option.scheme ? selectedIcon : unselectedIcon"></svg>
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</ng-template>
