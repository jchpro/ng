<div class="card flex col">
  <div class="card-header flex col x-center">
    @if (header()) {
      <div class="card-title">
        {{ header() }}
        @if (icon()) {
          <fa-icon size="2x" [icon]="icon()"></fa-icon>
        }
      </div>
    }
  </div>
  <div class="card-content">
    <ng-content></ng-content>
  </div>
</div>
