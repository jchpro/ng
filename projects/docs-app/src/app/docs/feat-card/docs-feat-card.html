<div class="card flex col">
  <div class="card-header flex col x-center">
    @if (header()) {
      <div class="card-title">
        {{ header() }}
        @if (icon(); as iconValue) {
          <svg [lucideIcon]="iconValue" size="2em" class="card-icon"></svg>
        }
      </div>
    }
  </div>
  <div class="card-content">
    <ng-content></ng-content>
  </div>
</div>
