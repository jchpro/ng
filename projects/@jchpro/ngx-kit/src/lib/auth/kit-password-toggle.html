<ng-content></ng-content>
<button type="button" class="kit-password-toggle__button" [attr.aria-label]="label()" (click)="toggle()">
  @if (visible()) {
    @if (customHideIcon()) {
      <ng-content select="[kitIcon=hide]"></ng-content>
    } @else {
      <svg lucideEyeOff size="18"></svg>
    }
  } @else {
    @if (customShowIcon()) {
      <ng-content select="[kitIcon=show]"></ng-content>
    } @else {
      <svg lucideEye size="18"></svg>
    }
  }
</button>
