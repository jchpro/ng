<kit-auth-card [heading]="flowLabels().title" [description]="flowLabels().description" [error]="error()">
  <ng-content select="[kitAuthLogo]" ngProjectAs="[kitAuthLogo]"></ng-content>

  <form class="kit-auth-form" novalidate (submit)="submit($event)">
    <ng-content select="[kitAuthFields]"></ng-content>

    <div class="kit-field">
      <label class="kit-field__label" [for]="passwordId">{{ l().setPassword.newPassword }}</label>
      <kit-password-toggle>
        <input class="kit-field__control"
               [id]="passwordId"
               name="password"
               type="password"
               autocomplete="new-password"
               aria-required="true"
               [attr.minlength]="minLength()"
               [attr.aria-invalid]="password.shownError() ? 'true' : null"
               [attr.aria-describedby]="passwordDescription()"
               [readOnly]="busy()"
               [value]="password.value()"
               (input)="password.update($event)"
               (blur)="password.touch()">
      </kit-password-toggle>
      @if (password.shownError(); as message) {
        <p class="kit-field__error" [id]="passwordId + '-error'"><svg lucideCircleAlert></svg>{{ message }}</p>
      } @else if (minLengthMessage(); as hint) {
        <p class="kit-field__hint" [id]="passwordId + '-hint'">{{ hint }}</p>
      }
    </div>

    <div class="kit-field">
      <label class="kit-field__label" [for]="confirmationId">{{ l().setPassword.confirmPassword }}</label>
      <kit-password-toggle>
        <input class="kit-field__control"
               [id]="confirmationId"
               name="confirmation"
               type="password"
               autocomplete="new-password"
               aria-required="true"
               [attr.aria-invalid]="confirmation.shownError() ? 'true' : null"
               [attr.aria-describedby]="confirmation.shownError() ? confirmationId + '-error' : null"
               [readOnly]="busy()"
               [value]="confirmation.value()"
               (input)="confirmation.update($event)"
               (blur)="confirmation.touch()">
      </kit-password-toggle>
      @if (confirmation.shownError(); as message) {
        <p class="kit-field__error" [id]="confirmationId + '-error'"><svg lucideCircleAlert></svg>{{ message }}</p>
      }
    </div>

    <button type="submit" class="kit-btn kit-btn--primary kit-btn--lg" [kitBusy]="busy()">{{ flowLabels().submit }}</button>
  </form>

  <ng-content select="[kitAuthFooter]" ngProjectAs="[kitAuthFooter]"></ng-content>
</kit-auth-card>
