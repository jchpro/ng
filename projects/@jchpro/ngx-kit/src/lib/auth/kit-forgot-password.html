<kit-auth-card
  [heading]="sent() ? l().forgotPassword.sentTitle : l().forgotPassword.title"
  [description]="sent() ? undefined : l().forgotPassword.description"
  [error]="error()">
  <ng-content select="[kitAuthLogo]" ngProjectAs="[kitAuthLogo]"></ng-content>

  @if (sent()) {
    <p class="kit-auth-notice kit-auth-notice--success"><svg lucideMailCheck></svg>{{ sentMessage() }}</p>
  } @else {
    <form class="kit-auth-form" novalidate (submit)="submit($event)">
      <div class="kit-field">
        <label class="kit-field__label" [for]="identifierId">{{ identifierLabel() }}</label>
        <input class="kit-field__control"
               [id]="identifierId"
               name="username"
               [type]="identifierType() === 'email' ? 'email' : 'text'"
               [attr.inputmode]="identifierType() === 'email' ? 'email' : null"
               autocomplete="username"
               autocapitalize="off"
               spellcheck="false"
               aria-required="true"
               [attr.aria-invalid]="identifier.shownError() ? 'true' : null"
               [attr.aria-describedby]="identifier.shownError() ? identifierId + '-error' : null"
               [readOnly]="busy()"
               [value]="identifier.value()"
               (input)="identifier.update($event)"
               (blur)="identifier.touch()">
        @if (identifier.shownError(); as message) {
          <p class="kit-field__error" [id]="identifierId + '-error'"><svg lucideCircleAlert></svg>{{ message }}</p>
        }
      </div>

      <button type="submit" class="kit-btn kit-btn--primary kit-btn--lg" [kitBusy]="busy()">{{ l().forgotPassword.submit }}</button>
    </form>
  }

  <ng-content select="[kitAuthFooter]" ngProjectAs="[kitAuthFooter]"></ng-content>
</kit-auth-card>
