<!-- Title -->
<h2 mat-dialog-title>
  {{ isSignal(data.title) ? data.title() : data.title }}
</h2>

<!-- With form -->
@if (hasNgFormHandler) {
  <form (ngSubmit)="data.ngFormSubmit?.()">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </form>
} @else {

  <!-- Without form -->
  <div class="dialog-content-wrapper">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </div>
}

<!-- Content -->
<ng-template #content>
  <div mat-dialog-content>
    <pro-render
      [content]="data.content"
      [templateContext]="data.templateContext">
    </pro-render>
  </div>

  <!-- Buttons -->
  <mat-dialog-actions>
    @for (button of data.buttons; track button) {
      <button
        [type]="(button.role === 'primary' && hasNgFormHandler) ? 'submit' : 'button'"
        [matButton]="button.appearance ?? (button.role === 'primary' ? 'filled' : 'outlined')"
        [disabled]="button.role === 'primary' && data.primaryDisabled && data.primaryDisabled()"
        [class.pro-has-icon]="!!button.icon"
        (click)="onButtonClick(button)">

        <!-- Icon: pro or template -->
        @if (typeof button.icon === 'string') {
          <pro-icon [icon]="button.icon" matButtonIcon></pro-icon>
        } @else if (button.icon) {
          <ng-container *ngTemplateOutlet="button.icon"></ng-container>
        }

        <!-- Label -->
        <span>{{ isSignal(button.label) ? button.label() : button.label  }}</span>
      </button>
    }
  </mat-dialog-actions>
</ng-template>
