<!-- Info -->
@if (showInfo() && !withDropzone()) {
  <div class="selection-info">

    <!-- Simple info from intl -->
    @if (showInfo() === true) {
      {{ intl.labels().selectionInfo(files()) }}
    } @else {

      <!-- Custom template -->
      <ng-container
        [ngTemplateOutlet]="$any(showInfo())"
        [ngTemplateOutletContext]="{ $implicit: files(), multiple: multiple() }">
      </ng-container>
    }
  </div>
}

<!-- Actions -->
<div class="actions"
     [class]="align() === 'start' ? 'row' : 'row-reverse'">

  <!-- Main select button -->
  <button
    type="button"
    [matButton]="selectAppearance()"
    (click)="nativeInput.click()">
    <pro-icon icon="browse_files" matButtonIcon></pro-icon>
    <span>{{ intl.labels().selectLabel }}</span>
  </button>

  <!-- Clear / remove button -->
  @if (files().length) {
    <button
      type="button"
      matButton="outlined"
      (click)="clear()">
      <pro-icon icon="clear_files" matButtonIcon></pro-icon>
      <span>{{ intl.labels().clearLabel }}</span>
    </button>
  }
</div>

<!-- Hidden native input -->
<input
  #nativeInput
  type="file"
  class="file-input"
  [disabled]="selectDisabled()"
  [attr.accept]="accept()"
  [attr.multiple]="multiple()"
  tabindex="-1"
  style="display: none;"
  (input)="onFileSelect(nativeInput)" />
