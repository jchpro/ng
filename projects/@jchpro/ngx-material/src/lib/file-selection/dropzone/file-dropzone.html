<!-- Info -->
@if (showInfo()) {

  <div class="info">

    <!-- Drag & drop message -->
    <div>
      @if (active()) {
        <strong>{{ intl.labels().dropzoneDropNowLabel }}</strong>
      } @else {
        <span>{{ intl.labels().dropzoneMainLabel }}</span>
      }
    </div>

    <!-- Simple info from intl -->
    @if (showInfo() === true) {
      {{ intl.labels().selectionInfo(for().files()) }}
    } @else {

      <!-- Custom template -->
      <ng-container
        [ngTemplateOutlet]="$any(showInfo())"
        [ngTemplateOutletContext]="{ $implicit: for().files(), multiple: for().multiple() }">
      </ng-container>
    }
  </div>
}
